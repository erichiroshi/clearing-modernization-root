plugins {
    // Plugins declarados aqui e aplicados seletivamente em cada submódulo (apply false)
    id 'org.springframework.boot' version '4.1.1' apply(false)
    id 'io.spring.dependency-management' version '1.1.7' apply(false)

    // gradle-avro-plugin foi doado ao projeto Apache Avro; confirme a versão mais recente
    // em https://github.com/davidmc24/gradle-avro-plugin/releases antes do primeiro build
    id 'com.github.davidmc24.gradle.plugin.avro' version '1.9.1' apply false
    id 'org.sonarqube' version '7.4.0.8496'
}

allprojects {
    group = 'br.com.erichiroshi.clearing'
    version = '0.3.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

// Configurações aplicadas a TODOS os submódulos do projeto
subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    dependencies {
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
        testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
        testImplementation 'org.assertj:assertj-core:3.27.7'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        finalizedBy tasks.named('jacocoTestReport')
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    jacocoTestReport {
        dependsOn tasks.named('test')
        reports {
            xml.required = true
            html.required = true
        }
    }
}

// Configuração do SonarCloud (Quality Gate bloqueia o merge do PR via check do GitHub Actions).
// sonar.organization e sonar.projectKey devem bater exatamente com o que foi criado em
// https://sonarcloud.io sob a organização "erichiroshi".
sonar {
    properties {
        property "sonar.projectKey", "erichiroshi_clearing-modernization"
        property "sonar.organization", "erichiroshi"

        property "sonar.coverage.jacoco.xmlReportPaths",
                subprojects.collect { "${it.layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml" }.join(",")
    }
}