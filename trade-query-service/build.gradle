plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

description = 'Microsserviço de leitura — consome TradeExecutedEvent do Kafka (Virtual Threads) e projeta a posição consolidada em MongoDB (CQRS)'

repositories {
    mavenCentral()
    // Necessário para kafka-avro-serializer / kafka-schema-registry-client
    maven {
        url = uri("https://packages.confluent.io/maven/")
    }
}

ext {
    confluentVersion = '8.3.1'
    testcontainersVersion = '2.0.5'
}

dependencies {
    implementation project(':clearing-contracts')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation "io.confluent:kafka-avro-serializer:${confluentVersion}"
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation platform("org.testcontainers:testcontainers-bom:${testcontainersVersion}")
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.testcontainers:kafka:1.21.4'
    testImplementation 'org.awaitility:awaitility:4.2.2'
    testImplementation 'org.mockito:mockito-junit-jupiter'
}
