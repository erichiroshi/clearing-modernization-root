plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

// retirar depois de implementado
bootJar {
    enabled = false
}

jar {
    enabled = true
}


description = 'Microsserviço de leitura — consome TradeExecutedEvent do Kafka (Virtual Threads) e projeta a posição consolidada em MongoDB (CQRS)'

repositories {
    mavenCentral()
    // Necessário para kafka-avro-serializer / kafka-schema-registry-client
    maven {
        url = uri("https://packages.confluent.io/maven/")
    }
}

ext {
    confluentVersion = '7.9.0' // confirme a versão compatível com a versão do Kafka usada no docker-compose
}

dependencies {
    implementation project(':clearing-contracts')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation "io.confluent:kafka-avro-serializer:${confluentVersion}"
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
//    testImplementation 'de.flapdoodle.embed:de.flapdoodle.embed.mongo.spring3x:4.19.0'
}
