name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-analyze:
    name: Build, testes e análise SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # necessário para o SonarCloud analisar histórico/blame corretamente
          fetch-depth: 0

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # Executa build, testes e gera o relatório do Jacoco
      - name: Build e testes (todos os módulos)
        run: ./gradlew build jacocoTestReport

      # Publica os resultados do JUnit
      - name: Publicar resultados de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'

      # Roda a análise do SonarCloud (gera build/sonar/report-task.txt na raiz)
      - name: Análise SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: ./gradlew sonar --info

      # Bloqueia o job (e, portanto, o merge do PR, via branch protection) se o
      # Quality Gate do SonarCloud reprovar. SONAR_HOST_URL é obrigatório aqui:
      # essa action consulta a API do Sonar diretamente e, sem ele, tenta
      # falar com o SonarQube.com em vez do SonarCloud — era a causa provável
      # da falha anterior.
      - name: Verificar Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        with:
          scanMetadataReportFile: build/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io