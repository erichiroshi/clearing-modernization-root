plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

description = 'Microsserviço de escrita — recebe intenções de trade, valida e persiste em PostgreSQL sob ACID, publica TradeExecutedEvent no Kafka'

repositories {
    mavenCentral()
    // Necessário para kafka-avro-serializer / kafka-schema-registry-client
    maven {
        url = uri ("https://packages.confluent.io/maven/") }
}

ext {
    confluentVersion = '8.3.1'
    testcontainersVersion = '2.0.5'
    jacksonDdatatypeJsr310Version = '2.15.2'
}

dependencies {
    implementation project(':clearing-domain')
    implementation project(':clearing-contracts')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation "io.confluent:kafka-avro-serializer:${confluentVersion}"
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Flyway cuida do schema; Hibernate só valida (ddl-auto: validate)
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonDdatatypeJsr310Version}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'

    implementation platform("org.testcontainers:testcontainers-bom:${testcontainersVersion}")
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:kafka:1.21.4'
}
