spring:
  application:
    name: trade-ingestion-service

  datasource:
    url: jdbc:postgresql://localhost:5432/clearing
    username: clearing
    password: clearing

  jpa:
    open-in-view: false
    hibernate:
      # Flyway é quem cria/versiona o schema; Hibernate só valida que o
      # mapeamento das entidades bate com o que existe no banco.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:9092,localhost:9093,localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: http://localhost:8081

clearing:
  kafka:
    topic:
      trade-executed: market.trades.v1
  outbox:
    # intervalo entre execuções do poller (ms) — cada execução processa até
    # 50 eventos pendentes, um por vez, em transações curtas
    poll-interval-ms: 2000

server:
  port: 8080 #verificar depois pois sobe o schema registry na 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info
